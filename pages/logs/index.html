<!doctype html>
<html lang="zh-CN" data-skin="console" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LogVault</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="lv-app">
      <div class="lv-aurora" aria-hidden="true"><i></i><i></i><i></i></div>

      <header class="lv-top">
        <div class="lv-brand">
          <span class="lv-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M5.3 5.3a1.9 1.9 0 0 1 1.9-1.9h6.3l5.2 5.2v6.3c0 3.2-3.1 5.5-6.7 6.7-3.6-1.2-6.7-3.5-6.7-6.7Z" />
              <path d="M13.5 3.4v3.4a1.9 1.9 0 0 0 1.9 1.9h3.3" />
              <path d="M8.6 11.6h6.8M8.6 14.6h4.4" />
            </svg>
          </span>
          <div class="lv-brand-text">
            <h1 id="page-title">LogVault 控制台</h1>
            <p id="page-desc">采集诊断、实时日志流、分类归档与安全导出</p>
          </div>
        </div>
        <div class="lv-top-actions">
          <div class="lv-field lv-field-skin">
            <label id="skin-label" for="skin-select">皮肤</label>
            <select id="skin-select" class="lv-input"></select>
          </div>
          <button id="btn-density" class="lv-btn lv-btn-ghost" type="button" title="切换行高">紧凑</button>
          <button id="btn-refresh" class="lv-btn" type="button">刷新</button>
          <button id="btn-clean" class="lv-btn lv-btn-warn" type="button">立即清理</button>
        </div>
      </header>

      <nav class="lv-tabs" role="tablist" aria-label="LogVault">
        <button class="lv-tab is-active" type="button" role="tab" data-tab="overview" aria-selected="true">
          <span class="lv-tab-ico" aria-hidden="true">◧</span><span data-i18n="tab.overview">运行总览</span>
        </button>
        <button class="lv-tab" type="button" role="tab" data-tab="live" aria-selected="false">
          <span class="lv-tab-ico" aria-hidden="true">▤</span><span data-i18n="tab.live">实时日志</span>
        </button>
        <button class="lv-tab" type="button" role="tab" data-tab="files" aria-selected="false">
          <span class="lv-tab-ico" aria-hidden="true">▥</span><span data-i18n="tab.files">日志文件</span>
        </button>
        <button class="lv-tab" type="button" role="tab" data-tab="search" aria-selected="false">
          <span class="lv-tab-ico" aria-hidden="true">⌕</span><span data-i18n="tab.search">全局搜索</span>
        </button>
        <button class="lv-tab" type="button" role="tab" data-tab="export" aria-selected="false">
          <span class="lv-tab-ico" aria-hidden="true">⤓</span><span data-i18n="tab.export">导出中心</span>
        </button>
        <button class="lv-tab" type="button" role="tab" data-tab="diag" aria-selected="false">
          <span class="lv-tab-ico" aria-hidden="true">◈</span><span data-i18n="tab.diag">采集诊断</span>
        </button>
      </nav>

      <main class="lv-panels">
        <section class="lv-panel is-active" id="panel-overview" role="tabpanel">
          <div id="metrics" class="lv-metrics" aria-live="polite"></div>
          <div id="warn-banner" class="lv-banner" hidden></div>
          <div class="lv-grid-2">
            <article class="lv-card">
              <header class="lv-card-head">
                <h2 data-i18n="card.capture">采集通路</h2>
                <span id="capture-mode" class="lv-pill"></span>
              </header>
              <div id="capture-body" class="lv-card-body"></div>
            </article>
            <article class="lv-card">
              <header class="lv-card-head">
                <h2 data-i18n="card.sources">日志来源</h2>
                <span id="sources-count" class="lv-pill"></span>
              </header>
              <div id="sources-body" class="lv-card-body"></div>
            </article>
          </div>
          <article class="lv-card">
            <header class="lv-card-head">
              <h2 data-i18n="card.dist">分类占用</h2>
              <span id="dist-total" class="lv-pill"></span>
            </header>
            <div id="dist-body" class="lv-card-body"></div>
          </article>
          <article class="lv-card" id="clean-card" hidden>
            <header class="lv-card-head">
              <h2 data-i18n="card.clean">维护结果</h2>
              <span id="clean-when" class="lv-pill"></span>
            </header>
            <div id="clean-body" class="lv-card-body"></div>
            <div class="lv-card-actions" id="clean-actions" hidden>
              <button id="btn-clean-deep" class="lv-btn lv-btn-ghost" type="button"></button>
            </div>
          </article>
        </section>

        <section class="lv-panel" id="panel-live" role="tabpanel" hidden>
          <div class="lv-toolbar lv-toolbar-sticky">
            <div class="lv-field lv-field-grow lv-field-combo">
              <label for="live-file-input" data-i18n="live.file">跟随文件</label>
              <div class="lv-combo" id="live-file-combo">
                <input id="live-file-input" class="lv-input lv-combo-input" type="text" role="combobox"
                  aria-expanded="false" aria-controls="live-file-list" aria-autocomplete="list"
                  autocomplete="off" spellcheck="false" placeholder="搜索或选择日志文件" />
                <button id="live-file-toggle" class="lv-combo-caret" type="button" tabindex="-1" aria-hidden="true">▾</button>
                <div id="live-file-list" class="lv-combo-list" role="listbox" hidden></div>
              </div>
              <select id="live-file" class="lv-combo-native" tabindex="-1" aria-hidden="true"></select>
            </div>
            <div class="lv-field">
              <label for="live-level" data-i18n="live.level">级别</label>
              <select id="live-level" class="lv-input">
                <option value="">全部级别</option>
                <option value="DEBUG">DEBUG+</option>
                <option value="INFO">INFO+</option>
                <option value="WARNING">WARNING+</option>
                <option value="ERROR">ERROR+</option>
                <option value="CRITICAL">CRITICAL</option>
              </select>
            </div>
            <div class="lv-field">
              <label for="live-tag" data-i18n="live.tag">来源标签</label>
              <select id="live-tag" class="lv-input"></select>
            </div>
            <div class="lv-field lv-field-grow">
              <label for="live-keyword" data-i18n="live.keyword">关键词</label>
              <input id="live-keyword" class="lv-input" type="search" placeholder="搜索日志内容" />
            </div>
            <label class="lv-switch">
              <input id="live-follow" type="checkbox" checked />
              <span class="lv-switch-track" aria-hidden="true"><i></i></span>
              <span data-i18n="live.follow">实时跟随</span>
            </label>
            <button id="btn-live-copy" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.copy">复制</button>
            <button id="btn-live-reload" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.reload">重载</button>
            <button id="btn-live-export" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.exportView">导出视图</button>
            <button id="btn-live-clear" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.clearView">清屏</button>
          </div>
          <div id="live-stream" class="lv-stream" tabindex="0" aria-live="polite"></div>
          <div class="lv-statline"><span id="live-meta"></span><span id="live-hint" class="lv-muted"></span></div>
        </section>

        <section class="lv-panel" id="panel-files" role="tabpanel" hidden>
          <div class="lv-split">
            <aside class="lv-side">
              <div class="lv-side-head">
                <h2 data-i18n="files.categories">分类</h2>
                <input id="category-filter" class="lv-input" type="search" placeholder="过滤分类" />
                <button id="btn-export-category" class="lv-btn lv-btn-ghost lv-btn-mini" type="button" data-i18n="action.exportCategory">导出此分类</button>
              </div>
              <div id="tree" class="lv-tree" role="tree"></div>
            </aside>
            <div class="lv-side-main">
              <div class="lv-toolbar lv-toolbar-sticky">
                <span id="file-scope" class="lv-scope">未选择分类</span>
                <div class="lv-field lv-field-grow">
                  <input id="file-filter" class="lv-input" type="search" placeholder="过滤文件名" />
                </div>
                <select id="file-sort" class="lv-input" aria-label="排序">
                  <option value="mtime" data-i18n="files.sortMtime">按时间</option>
                  <option value="size" data-i18n="files.sortSize">按大小</option>
                  <option value="name" data-i18n="files.sortName">按名称</option>
                </select>
                <button id="btn-export-files" class="lv-btn lv-btn-ghost" type="button" disabled data-i18n="action.exportSelected">导出所选</button>
                <button id="btn-delete" class="lv-btn lv-btn-danger" type="button" disabled data-i18n="action.delete">删除所选</button>
              </div>
              <div class="lv-tablewrap">
                <table class="lv-table">
                  <thead>
                    <tr>
                      <th class="lv-col-check"><input id="check-all" type="checkbox" aria-label="全选" /></th>
                      <th data-i18n="files.colFile">文件</th>
                      <th data-i18n="files.colCategory">分类</th>
                      <th class="lv-num" data-i18n="files.colSize">大小</th>
                      <th data-i18n="files.colTime">修改时间</th>
                      <th class="lv-col-act"></th>
                    </tr>
                  </thead>
                  <tbody id="file-rows"></tbody>
                </table>
                <p id="file-empty" class="lv-empty">请选择左侧分类</p>
              </div>
            </div>
          </div>
        </section>

        <section class="lv-panel" id="panel-search" role="tabpanel" hidden>
          <div class="lv-toolbar lv-toolbar-sticky">
            <div class="lv-field lv-field-grow">
              <label for="search-keyword" data-i18n="search.keyword">关键词</label>
              <input id="search-keyword" class="lv-input" type="search" placeholder="跨来源搜索全部日志" />
            </div>
            <div class="lv-field">
              <label for="search-limit" data-i18n="search.limit">条数上限</label>
              <input id="search-limit" class="lv-input lv-input-num" type="number" min="10" max="500" step="10" value="100" />
            </div>
            <button id="btn-search" class="lv-btn lv-btn-primary" type="button" data-i18n="action.search">搜索</button>
            <button id="btn-export-search" class="lv-btn lv-btn-ghost" type="button" disabled data-i18n="action.exportHits">导出结果</button>
            <span id="search-meta" class="lv-muted"></span>
          </div>
          <div id="search-results" class="lv-results"></div>
        </section>

        <section class="lv-panel" id="panel-export" role="tabpanel" hidden>
          <div class="lv-export">
            <article class="lv-card lv-export-builder">
              <header class="lv-card-head">
                <h2 data-i18n="export.builder">导出构建器</h2>
                <span id="export-pill" class="lv-pill"></span>
              </header>
              <div class="lv-card-body lv-stack">
                <div class="lv-toolbar">
                  <div class="lv-field">
                    <label for="export-scope" data-i18n="export.scope">范围</label>
                    <select id="export-scope" class="lv-input">
                      <option value="preset" data-i18n="export.scopePreset">预设范围</option>
                      <option value="category" data-i18n="export.scopeCategory">当前分类</option>
                      <option value="selection" data-i18n="export.scopeSelection">已勾选文件</option>
                      <option value="plugin" data-i18n="export.scopePlugin">指定插件</option>
                    </select>
                  </div>
                  <div class="lv-field" id="export-preset-field">
                    <label for="export-preset" data-i18n="export.preset">预设</label>
                    <select id="export-preset" class="lv-input">
                      <option value="all" data-i18n="export.presetAll">全部日志</option>
                      <option value="errors" data-i18n="export.presetErrors">仅错误日志</option>
                      <option value="core" data-i18n="export.presetCore">核心日志</option>
                    </select>
                  </div>
                  <div class="lv-field lv-field-grow" id="export-plugin-field" hidden>
                    <label for="export-plugin" data-i18n="export.plugin">插件</label>
                    <input id="export-plugin" class="lv-input" type="text" list="plugin-options" placeholder="插件名" autocomplete="off" />
                    <datalist id="plugin-options"></datalist>
                  </div>
                  <div class="lv-field">
                    <label for="export-format" data-i18n="export.format">格式</label>
                    <select id="export-format" class="lv-input">
                      <option value="zip" data-i18n="export.formatZip">ZIP 压缩包</option>
                      <option value="merged" data-i18n="export.formatMerged">合并 TXT</option>
                    </select>
                  </div>
                </div>
                <p class="lv-note" id="export-scope-note"></p>
                <div class="lv-toolbar">
                  <div class="lv-field">
                    <label for="export-days" data-i18n="export.days">最近天数</label>
                    <input id="export-days" class="lv-input lv-input-num" type="number" min="0" max="3650" value="7" />
                  </div>
                  <div class="lv-field">
                    <label for="export-since" data-i18n="export.since">起始日期</label>
                    <input id="export-since" class="lv-input" type="date" />
                  </div>
                  <div class="lv-field">
                    <label for="export-until" data-i18n="export.until">结束日期</label>
                    <input id="export-until" class="lv-input" type="date" />
                  </div>
                  <button id="btn-export-window" class="lv-btn lv-btn-ghost lv-btn-mini" type="button" data-i18n="action.clearWindow">清除时间</button>
                </div>
                <div class="lv-fieldset">
                  <span class="lv-fieldset-title" data-i18n="export.levels">级别过滤</span>
                  <div id="export-levels" class="lv-chips" role="group"></div>
                </div>
                <div class="lv-toolbar">
                  <div class="lv-field lv-field-grow">
                    <label for="export-keyword" data-i18n="export.keyword">关键词</label>
                    <input id="export-keyword" class="lv-input" type="search" placeholder="只保留包含该关键词的行" />
                  </div>
                  <label class="lv-switch">
                    <input id="export-mask" type="checkbox" checked />
                    <span class="lv-switch-track" aria-hidden="true"><i></i></span>
                    <span data-i18n="export.mask">导出前脱敏</span>
                  </label>
                </div>
                <div class="lv-toolbar lv-toolbar-end">
                  <button id="btn-export-plan" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.exportPlan">预检</button>
                  <button id="btn-export-run" class="lv-btn lv-btn-primary" type="button" data-i18n="action.exportRun">开始导出</button>
                  <span id="export-hint" class="lv-muted"></span>
                </div>
                <div id="export-preview" class="lv-preview" aria-live="polite"></div>
                <p class="lv-note" id="slice-note"></p>
              </div>
            </article>
            <article class="lv-card lv-export-history">
              <header class="lv-card-head">
                <h2 data-i18n="export.history">导出历史</h2>
                <span class="lv-head-actions">
                  <span id="export-history-pill" class="lv-pill"></span>
                  <button id="btn-export-reload" class="lv-btn lv-btn-ghost lv-btn-mini" type="button" data-i18n="action.reload">重载</button>
                  <button id="btn-export-purge" class="lv-btn lv-btn-danger lv-btn-mini" type="button" data-i18n="action.purgeAll">清空</button>
                </span>
              </header>
              <div id="export-history" class="lv-card-body"></div>
            </article>
          </div>
        </section>
        <section class="lv-panel" id="panel-diag" role="tabpanel" hidden>
          <div class="lv-grid-2">
            <article class="lv-card">
              <header class="lv-card-head">
                <h2 data-i18n="diag.pipeline">采集链路</h2>
                <button id="btn-diag-refresh" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.recheck">重新检测</button>
              </header>
              <div id="diag-pipeline" class="lv-card-body"></div>
            </article>
            <article class="lv-card">
              <header class="lv-card-head"><h2 data-i18n="diag.routes">WebUI 接口</h2></header>
              <div id="diag-routes" class="lv-card-body"></div>
            </article>
          </div>
          <article class="lv-card">
            <header class="lv-card-head"><h2 data-i18n="diag.loggers">已挂载 logger</h2></header>
            <div id="diag-loggers" class="lv-card-body"></div>
          </article>
          <article class="lv-card">
            <header class="lv-card-head"><h2 data-i18n="diag.tips">排查建议</h2></header>
            <div id="diag-tips" class="lv-card-body"></div>
          </article>
        </section>
      </main>

      <footer class="lv-status">
        <span id="status-left" class="lv-muted"></span>
        <span id="status-right" class="lv-muted"></span>
      </footer>

      <div id="drawer" class="lv-drawer" hidden aria-hidden="true">
        <div class="lv-drawer-mask" data-close="1"></div>
        <div class="lv-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
          <header class="lv-drawer-head">
            <div class="lv-drawer-title">
              <h2 id="drawer-title">未打开文件</h2>
              <p id="drawer-sub" class="lv-muted"></p>
            </div>
            <button id="drawer-close" class="lv-btn lv-btn-ghost" type="button" data-close="1">关闭</button>
          </header>
          <div class="lv-toolbar">
            <div class="lv-field">
              <label for="view-level" data-i18n="view.level">级别</label>
              <select id="view-level" class="lv-input">
                <option value="">全部级别</option>
                <option value="DEBUG">DEBUG+</option>
                <option value="INFO">INFO+</option>
                <option value="WARNING">WARNING+</option>
                <option value="ERROR">ERROR+</option>
                <option value="CRITICAL">CRITICAL</option>
              </select>
            </div>
            <div class="lv-field lv-field-grow">
              <label for="view-keyword" data-i18n="view.keyword">关键词</label>
              <input id="view-keyword" class="lv-input" type="search" placeholder="过滤行" />
            </div>
            <div class="lv-field">
              <label for="view-tail" data-i18n="view.tail">行数</label>
              <input id="view-tail" class="lv-input lv-input-num" type="number" min="50" max="5000" step="50" value="500" />
            </div>
            <label class="lv-switch">
              <input id="view-follow" type="checkbox" />
              <span class="lv-switch-track" aria-hidden="true"><i></i></span>
              <span data-i18n="view.follow">跟随</span>
            </label>
            <button id="btn-view-copy" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.copy">复制</button>
            <button id="btn-reload" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.reload">重载</button>
            <button id="btn-download" class="lv-btn lv-btn-ghost" type="button" data-i18n="action.download">下载</button>
          </div>
          <div id="log-view" class="lv-stream lv-stream-drawer" tabindex="0"></div>
          <div class="lv-statline"><span id="view-meta" class="lv-muted"></span></div>
        </div>
      </div>

      <div id="confirm-layer" class="lv-modal-layer" hidden>
        <div class="lv-modal-veil" data-confirm-cancel></div>
        <div
          class="lv-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="confirm-title"
          aria-describedby="confirm-text"
        >
          <div class="lv-modal-head">
            <span class="lv-modal-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.7 3 19.3a1.4 1.4 0 0 0 1.2 2.1h15.6a1.4 1.4 0 0 0 1.2-2.1Z" />
                <path d="M12 9.5v4.6" />
                <path d="M12 17.5h.01" />
              </svg>
            </span>
            <h2 id="confirm-title">需要确认</h2>
          </div>
          <p id="confirm-text" class="lv-modal-text"></p>
          <p id="confirm-note" class="lv-modal-note" hidden></p>
          <div class="lv-modal-actions">
            <button id="confirm-cancel" class="lv-btn lv-btn-ghost" type="button" data-confirm-cancel data-i18n="action.cancel">取消</button>
            <button id="confirm-ok" class="lv-btn lv-btn-primary" type="button">确认</button>
          </div>
        </div>
      </div>

      <div id="toast" class="lv-toast" role="status" hidden></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
